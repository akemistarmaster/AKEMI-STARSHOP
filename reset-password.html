<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKEMI STARSHOP — Reset Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08070d;--card:#12101b;--soft:#181525;--purple:#8b5cf6;--light:#a78bfa;--muted:#9d99ad;--border:rgba(139,92,246,.18);--text:#f8f7ff;--danger:#fca5a5;--ok:#86efac}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,rgba(124,58,237,.22),transparent 45%),var(--bg)}
.card{width:min(430px,100%);padding:28px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.logo{text-align:center;font-size:22px;font-weight:800;margin-bottom:7px}.logo span{color:var(--light)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:25px}
.title{font-size:19px;font-weight:800;margin-bottom:8px}.desc{font-size:12px;color:#c8c3d4;line-height:1.6;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:700;margin:13px 0 7px}
input{width:100%;height:46px;background:#0d0b14;color:white;border:1px solid var(--border);border-radius:10px;padding:12px;outline:none}input:focus{border-color:var(--purple)}
.btn{width:100%;border:0;border-radius:10px;padding:12px 16px;color:white;font-weight:700;background:linear-gradient(135deg,var(--purple),#6d28d9);margin-top:16px}
.msg{font-size:12px;line-height:1.55;margin-top:12px;color:var(--danger);white-space:pre-line}.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">🎮 AKEMI <span>STARSHOP</span></div>
    <div class="sub">Reset Password Admin</div>

    <div id="loading">
      <div class="title">Memverifikasi link...</div>
      <div class="desc">Tunggu sebentar, kami sedang memeriksa link reset password kamu.</div>
    </div>

    <form id="resetForm" class="hidden">
      <div class="title">Buat Password Baru</div>
      <div class="desc">Masukkan password baru untuk akun admin AKEMI STARSHOP.</div>
      <label>Password Baru</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      <label>Ulangi Password Baru</label>
      <input id="password2" type="password" autocomplete="new-password" minlength="6" required>
      <button id="submitBtn" class="btn" type="submit">🔐 Simpan Password Baru</button>
      <div id="msg" class="msg"></div>
    </form>

    <div id="errorBox" class="hidden">
      <div class="title">Link Reset Tidak Dapat Digunakan</div>
      <div id="errorMsg" class="desc"></div>
      <button id="backBtn" class="btn" type="button">← Kembali ke Admin</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const ADMIN_URL="https://akemistarshop.netlify.app/admin.html";
let handled=false;

function showReset(){
  $("loading").classList.add("hidden");
  $("errorBox").classList.add("hidden");
  $("resetForm").classList.remove("hidden");
}
function showError(message){
  $("loading").classList.add("hidden");
  $("resetForm").classList.add("hidden");
  $("errorBox").classList.remove("hidden");
  $("errorMsg").textContent=message;
}
function cleanUrl(){
  try{history.replaceState({},document.title,window.location.pathname);}catch(e){}
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY" && session) showReset();
  else if(event==="SIGNED_IN" && session && /access_token=|type=recovery|code=/.test(window.location.hash+window.location.search)) showReset();
});

async function init(){
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error) throw error;
    if(data?.session){showReset();return;}
    const hash=window.location.hash;
    const search=window.location.search;
    if(/error=|error_description=/.test(hash+search)){
      const params=new URLSearchParams(hash.replace(/^#/,'')||search.replace(/^\?/,''));
      showError(params.get("error_description")||"Link reset password tidak valid atau sudah kedaluwarsa.");
      return;
    }
    showError("Sesi reset password tidak ditemukan. Silakan minta link reset password baru dari halaman Admin.");
  }catch(err){
    console.error(err);
    showError("Gagal memverifikasi link reset password. Silakan minta link reset password baru.");
  }
}

$("resetForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(handled)return;
  const p=$("password").value;
  const p2=$("password2").value;
  const msg=$("msg");
  const btn=$("submitBtn");
  msg.className="msg";msg.textContent="";
  if(p.length<6){msg.textContent="Password baru minimal 6 karakter.";return;}
  if(p!==p2){msg.textContent="Konfirmasi password tidak sama.";return;}
  btn.disabled=true;btn.textContent="⏳ Menyimpan...";
  try{
    const {error}=await supabaseClient.auth.updateUser({password:p});
    if(error)throw error;
    handled=true;
    msg.className="msg ok";
    msg.textContent="Password berhasil diubah. Mengarahkan ke Admin...";
    cleanUrl();
    setTimeout(async()=>{
      try{await supabaseClient.auth.signOut({scope:"local"});}catch(e){}
      window.location.href=ADMIN_URL;
    },900);
  }catch(err){
    msg.className="msg";
    msg.textContent="Gagal mengubah password: "+(err?.message||err);
    btn.disabled=false;btn.textContent="🔐 Simpan Password Baru";
  }
});

$("backBtn").addEventListener("click",()=>{window.location.href=ADMIN_URL;});
init();
</script>
</body>
</html>
